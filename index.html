<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kartta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; width:100%; background:#dbe9f5; }
  #map { position:absolute; inset:0; height:100%; width:100%; }
  .leaflet-tile { will-change: transform; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var finlandBounds = L.latLngBounds([54.5, 14.0], [71.5, 35.0]);

  var map = L.map('map', {
    preferCanvas: true,
    fadeAnimation: false,
    markerZoomAnimation: false,
    inertia: true,
    inertiaDeceleration: 4000,
    worldCopyJump: false,
    maxBounds: finlandBounds,
    maxBoundsViscosity: 0.8,
    zoomSnap: 1,
    wheelPxPerZoomLevel: 120
  }).setView([64.5, 26.5], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    minZoom: 4,
    maxZoom: 17,
    detectRetina: false,
    updateWhenZooming: false,
    updateWhenIdle: true,
    keepBuffer: 2,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
</script>
</body>
</html>
